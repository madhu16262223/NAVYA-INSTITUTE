<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glowAI" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Ambient Dark Backdrop Glow -->
  <circle cx="160" cy="110" r="100" fill="url(#aiGlow)"/>

  <!-- Neural Network Connections and Synapses (The AI Brain) -->
  <g transform="translate(160, 105)" filter="url(#glowAI)">
    <!-- Left Hemisphere Convolutions -->
    <path d="M-8,-65 C-45,-65 -75,-35 -75,5 C-75,35 -50,65 -15,70 C-10,71 -8,60 -8,55 C-8,45 -25,40 -35,25 C-45,10 -35,-20 -25,-35 C-15,-50 -10,-55 -8,-65 Z" fill="none" stroke="url(#brainGrad)" stroke-width="2.5" opacity="0.85"/>
    <path d="M-8,-45 C-35,-45 -55,-25 -55,5 C-55,25 -35,45 -12,48" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.75" stroke-dasharray="3 2"/>
    <path d="M-8,-25 C-25,-25 -38,-10 -38,10 C-38,25 -20,32 -8,35" fill="none" stroke="#22d3ee" stroke-width="1.8" opacity="0.8"/>

    <!-- Right Hemisphere Convolutions -->
    <path d="M8,-65 C45,-65 75,-35 75,5 C75,35 50,65 15,70 C10,71 8,60 8,55 C8,45 25,40 35,25 C45,10 35,-20 25,-35 C15,-50 10,-55 8,-65 Z" fill="none" stroke="url(#brainGrad)" stroke-width="2.5" opacity="0.85"/>
    <path d="M8,-45 C35,-45 55,-25 55,5 C55,25 35,45 12,48" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.75" stroke-dasharray="3 2"/>
    <path d="M8,-25 C25,-25 38,-10 38,10 C38,25 20,32 8,35" fill="none" stroke="#22d3ee" stroke-width="1.8" opacity="0.8"/>

    <!-- Interconnecting Synapse Lines -->
    <line x1="-50" y1="-20" x2="-25" y2="-35" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <line x1="-55" y1="5" x2="-35" y2="25" stroke="#c084fc" stroke-width="1.2" opacity="0.8"/>
    <line x1="-35" y1="25" x2="-15" y2="70" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <line x1="-25" y1="-35" x2="-8" y2="-45" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>

    <line x1="50" y1="-20" x2="25" y2="-35" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <line x1="55" y1="5" x2="35" y2="25" stroke="#c084fc" stroke-width="1.2" opacity="0.8"/>
    <line x1="35" y1="25" x2="15" y2="70" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <line x1="25" y1="-35" x2="8" y2="-45" stroke="#818cf8" stroke-width="1.2" opacity="0.8"/>

    <!-- Synaptic Nodes (Glowing Dots) -->
    <circle cx="-75" cy="5" r="4" fill="#22d3ee"/>
    <circle cx="-50" cy="-20" r="3.5" fill="#c084fc"/>
    <circle cx="-25" cy="-35" r="4.5" fill="#38bdf8"/>
    <circle cx="-55" cy="25" r="3.5" fill="#a855f7"/>
    <circle cx="-35" cy="25" r="4" fill="#22d3ee"/>
    <circle cx="-15" cy="70" r="4" fill="#c084fc"/>
    <circle cx="-38" cy="10" r="3" fill="#ffffff"/>

    <circle cx="75" cy="5" r="4" fill="#22d3ee"/>
    <circle cx="50" cy="-20" r="3.5" fill="#c084fc"/>
    <circle cx="25" cy="-35" r="4.5" fill="#38bdf8"/>
    <circle cx="55" cy="25" r="3.5" fill="#a855f7"/>
    <circle cx="35" cy="25" r="4" fill="#22d3ee"/>
    <circle cx="15" cy="70" r="4" fill="#c084fc"/>
    <circle cx="38" cy="10" r="3" fill="#ffffff"/>

    <circle cx="0" cy="-65" r="3" fill="#38bdf8"/>
    <circle cx="0" cy="55" r="3" fill="#c084fc"/>
  </g>

  <!-- Central Glowing 3D "AI" Glass Badge in Front -->
  <g transform="translate(132, 82)" filter="url(#glowAI)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#aiBadgeGrad)"/>
    <rect x="1" y="1" width="54" height="54" rx="13" fill="none" stroke="#e0e7ff" stroke-width="1.5" opacity="0.8"/>
    <!-- Glass reflection highlight -->
    <path d="M0,14 C0,6 6,0 14,0 L42,0 C50,0 56,6 56,14 L56,22 L0,32 Z" fill="#ffffff" opacity="0.2"/>
    <text x="28" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI</text>
  </g>

  <!-- Floating Binary/Code Particles -->
  <text x="50" y="60" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.6">01</text>
  <text x="240" y="55" font-family="monospace" font-size="7" fill="#c084fc" opacity="0.6">10</text>
  <text x="65" y="165" font-family="monospace" font-size="7" fill="#818cf8" opacity="0.6">AI/ML</text>
  <text x="235" y="170" font-family="monospace" font-size="7" fill="#38bdf8" opacity="0.6">GEN-AI</text>
</svg>
