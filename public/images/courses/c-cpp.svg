<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6659f5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cppBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007acc"/>
      <stop offset="100%" stop-color="#02569b"/>
    </linearGradient>
    <filter id="shadowC" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312e81" flood-opacity="0.3"/>
    </filter>
    <filter id="glowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6659f5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="140" cy="195" rx="100" ry="7" fill="#0f172a" opacity="0.18"/>

  <!-- Laptop Base in Perspective -->
  <g transform="translate(35, 148)" filter="url(#shadowC)">
    <polygon points="12,0 198,0 215,36 0,36" fill="#1e293b"/>
    <polygon points="13,1 197,1 213,34 2,34" fill="#334155"/>
    <rect x="88" y="16" width="38" height="15" rx="2" fill="#1e293b"/>
    <polygon points="26,3 182,3 194,14 18,14" fill="#0f172a"/>
    <line x1="28" y1="6" x2="183" y2="6" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 2"/>
    <line x1="25" y1="9" x2="187" y2="9" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 2"/>
    <line x1="22" y1="12" x2="191" y2="12" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 2"/>
  </g>

  <!-- Laptop Screen Lid -->
  <g transform="translate(48, 32)" filter="url(#shadowC)">
    <rect x="0" y="0" width="185" height="120" rx="7" fill="#1e293b"/>
    <rect x="2" y="2" width="181" height="116" rx="5" fill="#0f172a"/>
    <rect x="6" y="6" width="173" height="108" rx="3" fill="url(#ideBg)"/>

    <!-- IDE Window Titlebar -->
    <rect x="6" y="6" width="173" height="12" fill="#1e293b"/>
    <!-- Window buttons -->
    <circle cx="14" cy="12" r="2" fill="#ef4444"/>
    <circle cx="20" cy="12" r="2" fill="#f59e0b"/>
    <circle cx="26" cy="12" r="2" fill="#10b981"/>
    <!-- File Tab -->
    <rect x="36" y="8" width="52" height="10" rx="2" fill="#0f172a"/>
    <text x="44" y="15" font-family="'Fira Code', monospace" font-size="5" fill="#93c5fd">main.cpp</text>

    <!-- Sidebar Explorer -->
    <rect x="6" y="18" width="28" height="96" fill="#0b1120"/>
    <text x="10" y="27" font-family="sans-serif" font-weight="bold" font-size="4.5" fill="#64748b">EXPLORER</text>
    <text x="12" y="36" font-family="'Fira Code', monospace" font-size="4.5" fill="#94a3b8">📁 src</text>
    <text x="16" y="44" font-family="'Fira Code', monospace" font-size="4.5" fill="#38bdf8">📄 main.cpp</text>
    <text x="16" y="52" font-family="'Fira Code', monospace" font-size="4.5" fill="#94a3b8">📄 utils.h</text>
    <text x="16" y="60" font-family="'Fira Code', monospace" font-size="4.5" fill="#94a3b8">📄 math.c</text>

    <!-- Code Editor Content -->
    <g transform="translate(38, 22)">
      <!-- Line Numbers -->
      <text x="2" y="10" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">1</text>
      <text x="2" y="18" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">2</text>
      <text x="2" y="26" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">3</text>
      <text x="2" y="34" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">4</text>
      <text x="2" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">5</text>
      <text x="2" y="50" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">6</text>
      <text x="2" y="58" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">7</text>
      <text x="2" y="66" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">8</text>
      <text x="2" y="74" font-family="'Fira Code', monospace" font-size="4.5" fill="#475569">9</text>

      <!-- Code Text with Syntax Highlighting -->
      <text x="12" y="10" font-family="'Fira Code', monospace" font-size="4.5" fill="#ec4899">#include</text>
      <text x="36" y="10" font-family="'Fira Code', monospace" font-size="4.5" fill="#38bdf8">&lt;iostream&gt;</text>

      <text x="12" y="18" font-family="'Fira Code', monospace" font-size="4.5" fill="#a855f7">using namespace</text>
      <text x="56" y="18" font-family="'Fira Code', monospace" font-size="4.5" fill="#f8fafc">std;</text>

      <text x="12" y="34" font-family="'Fira Code', monospace" font-size="4.5" fill="#60a5fa">int</text>
      <text x="23" y="34" font-family="'Fira Code', monospace" font-size="4.5" fill="#34d399">main</text>
      <text x="35" y="34" font-family="'Fira Code', monospace" font-size="4.5" fill="#f8fafc">() {</text>

      <text x="18" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#38bdf8">cout</text>
      <text x="32" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#94a3b8">&lt;&lt;</text>
      <text x="40" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#fde047">"Navya Techno C++"</text>
      <text x="96" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#94a3b8">&lt;&lt;</text>
      <text x="104" y="42" font-family="'Fira Code', monospace" font-size="4.5" fill="#38bdf8">endl;</text>

      <text x="18" y="50" font-family="'Fira Code', monospace" font-size="4.5" fill="#60a5fa">int</text>
      <text x="28" y="50" font-family="'Fira Code', monospace" font-size="4.5" fill="#f8fafc">*ptr = &amp;score;</text>

      <text x="18" y="58" font-family="'Fira Code', monospace" font-size="4.5" fill="#f43f5e">return</text>
      <text x="36" y="58" font-family="'Fira Code', monospace" font-size="4.5" fill="#a78bfa">0;</text>

      <text x="12" y="66" font-family="'Fira Code', monospace" font-size="4.5" fill="#f8fafc">}</text>

      <!-- Cursor -->
      <line x1="16" y1="62" x2="16" y2="68" stroke="#38bdf8" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Floating Glossy "C" Badge on Right -->
  <g transform="translate(242, 68)" filter="url(#glowBadge)">
    <rect x="0" y="0" width="46" height="46" rx="10" fill="url(#cBadge)"/>
    <rect x="1" y="1" width="44" height="44" rx="9" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.6"/>
    <text x="23" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">C</text>
  </g>

  <!-- Floating Glossy "C++" Badge on Right Below -->
  <g transform="translate(225, 120)" filter="url(#glowBadge)">
    <rect x="0" y="0" width="50" height="42" rx="9" fill="url(#cppBadge)"/>
    <rect x="1" y="1" width="48" height="40" rx="8" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.7"/>
    <text x="25" y="29" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">C++</text>
  </g>
</svg>
