<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="fsScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowFS" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
    <filter id="glowReact" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="160" cy="195" rx="100" ry="7" fill="#022c22" opacity="0.15"/>
  <ellipse cx="65" cy="188" rx="20" ry="4" fill="#022c22" opacity="0.15"/>

  <!-- Laptop Base in Perspective -->
  <g transform="translate(68, 146)" filter="url(#shadowFS)">
    <polygon points="12,0 180,0 196,36 0,36" fill="#1e293b"/>
    <polygon points="13,1 178,1 194,34 2,34" fill="#334155"/>
    <rect x="78" y="16" width="36" height="15" rx="2" fill="#1e293b"/>
    <polygon points="24,3 166,3 176,14 16,14" fill="#0f172a"/>
    <line x1="26" y1="6" x2="168" y2="6" stroke="#475569" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="23" y1="9" x2="171" y2="9" stroke="#475569" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="20" y1="12" x2="174" y2="12" stroke="#475569" stroke-width="1" stroke-dasharray="5 2"/>
  </g>

  <!-- Laptop Screen Lid -->
  <g transform="translate(78, 34)" filter="url(#shadowFS)">
    <rect x="0" y="0" width="170" height="114" rx="7" fill="#1e293b"/>
    <rect x="2" y="2" width="166" height="110" rx="5" fill="#0f172a"/>
    <rect x="5" y="5" width="160" height="104" rx="3" fill="url(#fsScreen)"/>

    <!-- Browser Window Bar -->
    <rect x="5" y="5" width="160" height="11" fill="#334155"/>
    <circle cx="12" cy="10.5" r="2" fill="#ef4444"/>
    <circle cx="18" cy="10.5" r="2" fill="#f59e0b"/>
    <circle cx="24" cy="10.5" r="2" fill="#10b981"/>
    <!-- URL searchbar -->
    <rect x="34" y="7.5" width="80" height="6" rx="2" fill="#0f172a"/>
    <text x="40" y="12" font-family="'Segoe UI', sans-serif" font-size="4" fill="#94a3b8">https://my-app.dev/dashboard</text>

    <!-- Web App Dashboard Mockup on Screen -->
    <!-- Navbar -->
    <rect x="5" y="16" width="160" height="9" fill="#0f172a"/>
    <rect x="12" y="19" width="18" height="3" rx="1" fill="#38bdf8"/>
    <rect x="120" y="19" width="10" height="3" rx="1" fill="#94a3b8"/>
    <rect x="134" y="19" width="10" height="3" rx="1" fill="#94a3b8"/>
    <circle cx="152" cy="20.5" r="2" fill="#31c48d"/>

    <!-- Hero Card on web app -->
    <rect x="10" y="29" width="90" height="26" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.7"/>
    <text x="16" y="38" font-family="sans-serif" font-weight="bold" font-size="5" fill="#f8fafc">Modern Full Stack App</text>
    <text x="16" y="45" font-family="sans-serif" font-size="4" fill="#94a3b8">React + Node.js + Express + MongoDB</text>
    <rect x="16" y="48" width="22" height="4" rx="1.5" fill="#31c48d"/>
    <text x="20" y="51" font-family="sans-serif" font-weight="bold" font-size="3" fill="#ffffff">Get Started</text>

    <!-- Code Editor split on right -->
    <rect x="105" y="29" width="55" height="74" rx="3" fill="#0b1120" stroke="#1e293b" stroke-width="0.7"/>
    <g transform="translate(108, 33)" font-family="monospace" font-size="3.5">
      <text x="0" y="6" fill="#c084fc">import</text>
      <text x="16" y="6" fill="#38bdf8">React</text>
      <text x="0" y="14" fill="#60a5fa">const</text>
      <text x="12" y="14" fill="#fde047">App</text>
      <text x="20" y="14" fill="#f8fafc">=()=&gt;{</text>
      <text x="4" y="22" fill="#c084fc">return</text>
      <text x="18" y="22" fill="#38bdf8">&lt;Nav /&gt;</text>
      <text x="0" y="30" fill="#f8fafc">}</text>
      <text x="0" y="40" fill="#c084fc">export</text>
      <text x="15" y="40" fill="#38bdf8">default</text>
    </g>

    <!-- Bottom Stat Cards on web app -->
    <rect x="10" y="59" width="42" height="24" rx="2" fill="#1e293b"/>
    <rect x="14" y="63" width="14" height="2.5" rx="0.5" fill="#64748b"/>
    <text x="14" y="74" font-family="sans-serif" font-weight="bold" font-size="7" fill="#38bdf8">+84.5%</text>

    <rect x="56" y="59" width="44" height="24" rx="2" fill="#1e293b"/>
    <rect x="60" y="63" width="14" height="2.5" rx="0.5" fill="#64748b"/>
    <text x="60" y="74" font-family="sans-serif" font-weight="bold" font-size="7" fill="#31c48d">LIVE API</text>
  </g>

  <!-- Mobile Device on Left (Responsive Web) -->
  <g transform="translate(45, 96)" filter="url(#shadowFS)">
    <rect x="0" y="0" width="38" height="74" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="2" y="2" width="34" height="70" rx="4" fill="#0f172a"/>
    <!-- Speaker notch -->
    <rect x="14" y="4" width="10" height="2" rx="1" fill="#334155"/>
    <!-- Screen elements -->
    <rect x="6" y="12" width="26" height="14" rx="2" fill="#1e293b"/>
    <rect x="6" y="30" width="26" height="8" rx="1.5" fill="#0284c7"/>
    <rect x="6" y="42" width="12" height="12" rx="1.5" fill="#1e293b"/>
    <rect x="20" y="42" width="12" height="12" rx="1.5" fill="#1e293b"/>
    <rect x="6" y="58" width="26" height="8" rx="1.5" fill="#31c48d"/>
  </g>

  <!-- Floating React Atom Logo -->
  <g transform="translate(50, 48)" filter="url(#glowReact)">
    <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.6" transform="rotate(30 14 14)"/>
    <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.6" transform="rotate(90 14 14)"/>
    <ellipse cx="14" cy="14" rx="13" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.6" transform="rotate(150 14 14)"/>
    <circle cx="14" cy="14" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Floating HTML5 Shield Badge on Right -->
  <g transform="translate(254, 118)" filter="url(#shadowFS)">
    <!-- Shield Outline -->
    <polygon points="4,0 28,0 26,26 16,30 6,26" fill="#e44d26"/>
    <polygon points="16,2 26,2 24,24 16,28" fill="#f16529"/>
    <!-- The "5" -->
    <path d="M10,6 L22,6 L21.5,9 L13,9 L13.5,13 L21,13 L20,22 L16,23.5 L12,22 L12.5,19 L15,19 L15,20.5 L17,21 L18.5,16 L10.5,16 Z" fill="#ffffff"/>
  </g>

  <!-- Floating CSS3 Shield Badge on Right -->
  <g transform="translate(270, 148)" filter="url(#shadowFS)">
    <polygon points="3,0 25,0 23,24 14,27 5,24" fill="#0277bd"/>
    <polygon points="14,2 23,2 21.5,22 14,25" fill="#039be5"/>
    <path d="M8,5 L19.5,5 L19,8 L11,8 L11.5,12 L18.5,12 L17.5,20 L14,21 L10.5,20 L11,17 L13.5,17 L13.5,18 L15.5,18.5 L16.5,14.5 L8.5,14.5 Z" fill="#ffffff"/>
  </g>
</svg>
